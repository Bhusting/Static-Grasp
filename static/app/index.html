<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Get Grasp</title>
    <meta name="robots" content="noindex">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <p>Taking you to Grasp…</p>
    <!-- Manual fallback shown if the auto-redirect is blocked or slow -->
    <a id="fallback" href="https://static-grasp.pages.dev/#/">Continue</a>

    <script>
        (function () {
            var APP_STORE   = "https://apps.apple.com/us/app/grasp-e-reader/id6749806285";
            var GOOGLE_PLAY = "https://play.google.com/store/apps/details?id=com.envizionsft.graspui";
            var WEBSITE     = "https://static-grasp.pages.dev/#/";

            var ua = navigator.userAgent || navigator.vendor || window.opera || "";

            // iPadOS 13+ reports as "Macintosh"; detect it via touch support.
            var isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
            var isIOS = (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) || isIPadOS;
            var isAndroid = /android/i.test(ua);

            var target = isIOS ? APP_STORE : (isAndroid ? GOOGLE_PLAY : WEBSITE);

            // Point the manual fallback button at the right place too.
            document.getElementById("fallback").href = target;

            window.location.href = target;
        })();
    </script>
</body>
</html>
